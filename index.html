<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лев Майденко — аранжировка, оркестровка, саунд-продакшн</title>
<meta name="description" content="">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=12">
<link rel="stylesheet" href="css/texture.css?v=12">
<link rel="stylesheet" href="css/animations.css?v=12">
<link rel="stylesheet" href="css/hero-cinematic.css?v=12">
</head>
<body>

<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="brand" data-bind="nav.brand">Л.М.</a>
    <nav class="main-nav" id="mainNav" aria-label="Основная навигация">
      <ul id="navLinks"></ul>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span class="lang-current">RU</span><span class="lang-sep">/</span><span class="lang-other">EN</span>
      </button>
      <a href="index.html#contact" class="btn btn-primary btn-small" data-bind="nav.cta">Обсудить проект</a>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- Главный экран: фото на весь экран + градиентное затемнение -->
  <section class="hero">
    <div class="hero-media" aria-hidden="true">
      <img id="heroPhotoImg" src="" alt="">
    </div>
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <div class="hero-text reveal" data-reveal>
        <p class="annotation">
          <svg viewBox="0 0 26 14" width="26" height="14" aria-hidden="true"><path d="M1 10 Q7 2 13 8 T25 6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span id="heroAnnotation"></span>
        </p>
        <h1 id="heroName">Лев Майденко</h1>
        <p class="hero-role" id="heroRole"></p>
        <!-- Описание, кнопки и заметка на полях: при кинематографичной
             прокрутке этот блок сжимается, и надпись о ролике подъезжает
             вверх, к имени -->
        <div class="hero-lead" id="heroLead">
          <p class="hero-desc" id="heroDesc"></p>
          <div class="hero-cta">
            <a href="index.html#contact" class="btn btn-primary" id="heroCtaPrimary"></a>
            <a href="portfolio.html" class="btn btn-ghost" id="heroCtaSecondary"></a>
          </div>
          <p class="margin-note" id="heroMarginNote"></p>
        </div>

        <!-- «Мостик» к разделу с роликом. Показывается только при включённом
             флаге heroCinematic в js/flags.js — иначе остаётся скрытым. -->
        <div class="hero-intro-bridge" id="heroIntroBridge" hidden>
          <span class="eyebrow" id="heroIntroEyebrow"></span>
          <h2 id="heroIntroHeading"></h2>
          <p class="hero-intro-sub" id="heroIntroSub"></p>
          <span class="hero-intro-cue" id="heroIntroCue"></span>

        </div>
      </div>

      <!-- Ознакомительный ролик всплывает справа от текста — только при
           включённом флаге heroCinematic в js/flags.js -->
      <div class="hero-intro-video" id="heroIntroVideo" hidden></div>

      <!-- Стрелка от текста к ролику: «рисуется» по мере прокрутки.
           Привязана к левому краю колонки с видео. -->
      <svg class="hero-intro-arrow" id="heroIntroArrow" viewBox="0 0 250 132" fill="none" aria-hidden="true">
        <path class="arrow-line" pathLength="1"
              d="M10 92 C 26 118, 88 124, 88 84
                 C 88 52, 40 52, 44 86
                 C 47 112, 96 108, 128 92
                 C 168 72, 200 52, 232 34"
              stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
        <path class="arrow-head" pathLength="1"
              d="M204 31 L 232 34 L 220 59"
              stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="hero-credit" id="heroPhotoCaption"></span>
  </section>

  <!-- Видео. Фон любого раздела ниже — фото или однотонный: зависит от того,
       задано ли «Фото в фоне раздела» в админке -->
  <section class="section intro-video-section" id="intro-video" data-glow>
    <div class="section-photo-bg" id="introVideoBgPhoto" aria-hidden="true"></div>
    <div class="wrap intro-video-inner">
      <div class="intro-video-text">
        <div class="section-head reveal" data-reveal>
          <span class="eyebrow" id="introVideoEyebrow"></span>
          <h2 id="introVideoHeading"></h2>
          <p class="section-sub" id="introVideoSub"></p>
        </div>
      </div>
      <div class="reveal" data-reveal id="introVideoPlayer"></div>
    </div>
  </section>

  <!-- Обо мне (тёмный фон + световые пятна) -->
  <section class="section section-deep" id="about" data-glow>
    <div class="section-photo-bg" id="aboutBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="aboutEyebrow"></span>
        <h2 id="aboutHeading"></h2>
      </div>
      <div class="about-grid">
        <div class="reveal" data-reveal>
          <div class="about-text" id="aboutParagraphs"></div>
          <div class="about-tags" id="aboutTags"></div>
          <p class="about-more"><a href="about.html" class="text-link" id="aboutReadMore">Подробнее обо мне →</a></p>
        </div>
        <div class="about-portrait reveal" data-reveal id="aboutPortrait"></div>
      </div>
    </div>
  </section>

  <!-- Для кого (фото в фоне) -->
  <section class="section" id="for-whom" data-glow>
    <div class="section-photo-bg" id="forWhomBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="forWhomEyebrow"></span>
        <h2 id="forWhomHeading"></h2>
        <p class="section-sub" id="forWhomSub"></p>
      </div>
      <div class="for-whom-grid" id="forWhomGrid"></div>
    </div>
  </section>

  <!-- Процесс (однотонный тёмный — чередуем с фото-разделами) -->
  <section class="section section-deep" id="process" data-glow>
    <div class="section-photo-bg" id="processBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="processEyebrow"></span>
        <h2 id="processHeading"></h2>
        <p class="section-sub" id="processSub"></p>
      </div>
      <ol class="process-steps" id="processSteps"></ol>
    </div>
  </section>

  <!-- Портфолио (однотонный фон + световые пятна) -->
  <section class="section" id="portfolio" data-glow>
    <div class="section-photo-bg" id="portfolioBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="portfolioEyebrow"></span>
        <h2 id="portfolioHeading"></h2>
        <p class="section-sub" id="portfolioSub"></p>
      </div>
      <div class="card-grid card-grid--3" id="portfolioGrid"></div>
      <div class="section-foot">
        <a href="portfolio.html" class="text-link" id="portfolioViewAll">Все проекты →</a>
      </div>
    </div>
  </section>

  <!-- Услуги (фото в фоне) -->
  <section class="section section-deep" id="services" data-glow>
    <div class="section-photo-bg" id="servicesBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="servicesEyebrow"></span>
        <h2 id="servicesHeading"></h2>
        <p class="section-sub" id="servicesSub"></p>
      </div>
      <div class="card-grid card-grid--3" id="servicesGrid"></div>
      <div class="section-foot">
        <a href="services.html" class="text-link" id="servicesViewAll">Все услуги →</a>
      </div>
    </div>
  </section>

  <!-- Отзывы (однотонный фон + световые пятна) -->
  <section class="section" id="testimonials" data-glow>
    <div class="section-photo-bg" id="testimonialsBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="testimonialsEyebrow"></span>
        <h2 id="testimonialsHeading"></h2>
        <p class="section-sub" id="testimonialsSub"></p>
      </div>
      <!-- Карусель: лента прокручивается вбок, стрелки и точки — под ней -->
      <div class="carousel" id="testimonialsCarousel">
        <button class="carousel-arrow prev" id="testimonialsPrev" type="button" aria-label="Предыдущий отзыв">‹</button>
        <div class="carousel-track" id="testimonialsTrack" tabindex="0" role="group" aria-label="Отзывы"></div>
        <button class="carousel-arrow next" id="testimonialsNext" type="button" aria-label="Следующий отзыв">›</button>
      </div>
      <div class="carousel-dots" id="testimonialsDots" aria-hidden="true"></div>

      <div class="testimonial-add">
        <button class="btn btn-ghost" id="reviewOpen" type="button"></button>
      </div>

      <!-- Форма отзыва: скрыта до нажатия кнопки -->
      <div class="review-form-wrap" id="reviewFormWrap" hidden>
        <form class="review-form" id="reviewForm" novalidate>
          <h3 id="reviewFormHeading"></h3>
          <p class="review-form-sub" id="reviewFormSub"></p>

          <div class="review-identity">
            <button class="btn btn-small btn-ghost" type="button" id="reviewVkBtn"></button>
            <button class="btn btn-small btn-ghost" type="button" id="reviewTgBtn"></button>
          </div>

          <div class="form-row"><label id="reviewNameLabel" for="reviewName"></label>
            <input type="text" id="reviewName" name="name" maxlength="80" required></div>
          <div class="form-row"><label id="reviewRoleLabel" for="reviewRole"></label>
            <input type="text" id="reviewRole" name="role" maxlength="120"></div>
          <div class="form-row"><label id="reviewProfileLabel" for="reviewProfile"></label>
            <input type="url" id="reviewProfile" name="profileUrl" maxlength="200" placeholder="https://">
            <span class="form-hint" id="reviewProfileHint"></span></div>

          <div class="form-row">
            <label id="reviewRatingLabel"></label>
            <div class="rating-input" id="reviewRating" role="radiogroup"></div>
          </div>

          <div class="form-row"><label id="reviewTextLabel" for="reviewText"></label>
            <textarea id="reviewText" name="text" rows="5" maxlength="1500" required></textarea></div>

          <label class="field-consent"><input type="checkbox" id="reviewConsent" required>
            <span id="reviewConsentLabel"></span></label>

          <!-- Ловушка для спам-ботов: живой человек это поле не видит -->
          <div class="hp-field" aria-hidden="true"><label>Не заполняйте<input type="text" id="reviewHp" name="website" tabindex="-1" autocomplete="off"></label></div>

          <div class="review-form-actions">
            <button type="submit" class="btn btn-primary" id="reviewSubmit"></button>
            <button type="button" class="btn btn-ghost" id="reviewCancel"></button>
          </div>
          <p class="form-note" id="reviewNote"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- Новости (фото в фоне) -->
  <section class="section section-deep" id="blog" data-glow>
    <div class="section-photo-bg" id="blogBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="blogEyebrow"></span>
        <h2 id="blogHeading"></h2>
        <p class="section-sub" id="blogSub"></p>
      </div>
      <div class="card-grid card-grid--3" id="blogGrid"></div>
      <div class="section-foot">
        <a href="blog.html" class="text-link" id="blogViewAll">Все новости →</a>
      </div>
    </div>
  </section>

  <!-- Частые вопросы (однотонный фон + световые пятна). На главной — первые
       пять вопросов, полный список живёт на faq.html -->
  <section class="section" id="faq" data-glow>
    <div class="section-photo-bg" id="faqBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="faqEyebrow"></span>
        <h2 id="faqHeading"></h2>
        <p class="section-sub" id="faqSub"></p>
      </div>
      <ul class="faq-list" id="faqList"></ul>
      <div class="section-foot">
        <a href="faq.html" class="text-link" id="faqViewAll">Все вопросы →</a>
      </div>
    </div>
  </section>

  <!-- Контакты (тёмный фон — чередуем с предыдущим разделом) -->
  <section class="section section-deep" id="contact" data-glow>
    <div class="section-photo-bg" id="contactBgPhoto" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="contactEyebrow"></span>
        <h2 id="contactHeading"></h2>
        <p class="section-sub" id="contactSub"></p>
      </div>
      <div class="contact-grid">
        <form class="contact-form reveal" data-reveal id="contactForm">
          <div class="form-row"><label id="labelName" for="fieldName">Имя</label><input type="text" id="fieldName" name="name" required></div>
          <div class="form-row"><label id="labelContact" for="fieldContact">Контакт</label><input type="text" id="fieldContact" name="contact" required></div>
          <div class="form-row"><label id="labelType" for="fieldType">Тип услуги</label><select id="fieldType" name="type"></select></div>
          <div class="form-row"><label id="labelMessage" for="fieldMessage">Описание задачи</label><textarea id="fieldMessage" name="message" rows="4" required></textarea></div>
          <label class="field-consent"><input type="checkbox" id="fieldConsent" required>
            <span id="labelConsent"></span></label>

          <!-- Ловушка для спам-ботов: живой человек это поле не видит -->
          <div class="hp-field" aria-hidden="true"><label>Не заполняйте<input type="text" id="fieldSite" name="website" tabindex="-1" autocomplete="off"></label></div>
          <button type="submit" class="btn btn-primary" id="formSubmit">Отправить</button>
          <p class="form-note" id="formNote"></p>
        </form>
        <aside class="contact-info reveal" data-reveal>
          <h3 id="contactDirectHeading"></h3>
          <p class="contact-direct-note" id="contactDirectNote"></p>
          <div class="contact-social" id="contactSocial"></div>
          <p class="contact-direct-foot" id="contactDirectFoot"></p>
        </aside>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div><span class="footer-brand" data-bind="nav.brand">Л.М.</span><span class="footer-tagline" data-bind="footer.tagline"></span></div>
    <p class="footer-rights" id="footerRights"></p>
    <a href="faq.html" class="footer-link" data-bind="footer.faq">Частые вопросы</a>
    <a href="privacy.html" class="footer-privacy" data-bind="footer.privacy">Политика конфиденциальности</a>
  </div>
</footer>

<script src="js/flags.js?v=12"></script>
<script src="js/content.js?v=12"></script>
<script src="js/common.js?v=12"></script>
<script src="js/reviews.js?v=12"></script>
<script src="js/hero-cinematic.js?v=12"></script>
<script src="js/page-home.js?v=12"></script>
<script src="js/mobile-carousel.js?v=12"></script>
</body>
</html>
