<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новость</title>
<meta name="description" content="">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=11">
<link rel="stylesheet" href="css/texture.css?v=11">
<link rel="stylesheet" href="css/animations.css?v=11">
</head>
<body>

<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="brand" data-bind="nav.brand">Л.М.</a>
    <nav class="main-nav" id="mainNav" aria-label="Основная навигация">
      <ul id="navLinks"></ul>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span class="lang-current">RU</span><span class="lang-sep">/</span><span class="lang-other">EN</span>
      </button>
      <a href="index.html#contact" class="btn btn-primary btn-small" data-bind="nav.cta">Обсудить проект</a>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <article>
    <section class="case-header post-header">
      <div class="case-hero-bg" id="postCoverBg" aria-hidden="true"></div>
      <div class="ink-stain" id="inkStain" aria-hidden="true"></div>
      <div class="wrap reveal" data-reveal>
        <span class="tag" id="postCategory"></span>
        <h1 id="postTitle"></h1>
        <p class="meta" id="postDate"></p>
        <p class="desc" id="postExcerpt"></p>
        <span class="placeholder-flag" id="placeholderFlag" style="display:none;"></span>
      </div>
    </section>

    <section class="post-body-section" id="postBodySection">
      <div class="wrap">
        <div class="post-body" id="postBody"></div>
      </div>
    </section>

    <section class="case-media" id="postPhotosSection">
      <div class="wrap">
        <h2 id="postPhotosHeading"></h2>
        <div class="media-grid" id="postPhotos"></div>
      </div>
    </section>

    <section class="post-links-section" id="postLinksSection">
      <div class="wrap">
        <h2 id="postLinksHeading"></h2>
        <ul class="post-links" id="postLinks"></ul>
      </div>
    </section>
  </article>

  <div class="case-back">
    <div class="wrap">
      <a href="blog.html" class="text-link" id="backLink"></a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div><span class="footer-brand" data-bind="nav.brand">Л.М.</span><span class="footer-tagline" data-bind="footer.tagline"></span></div>
    <p class="footer-rights" id="footerRights"></p>
    <a href="privacy.html" class="footer-privacy" data-bind="footer.privacy">Политика конфиденциальности</a>
  </div>
</footer>

<script src="js/content.js?v=11"></script>
<script src="js/common.js?v=11"></script>
<script src="js/page-post.js?v=11"></script>
</body>
</html>
