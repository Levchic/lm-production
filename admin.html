<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка сайта</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css?v=3">
</head>
<body>

<!-- Вход -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>Админка сайта</h1>
    <p class="login-hint">Пароль задаётся в <code>start.command</code> (переменная ADMIN_PASSWORD).</p>
    <label for="loginPassword">Пароль</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Войти</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<!-- Основной интерфейс -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">Админка сайта</span>
      <div class="lang-switch" id="langSwitch">
        <button type="button" data-lang="ru" class="active">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="topbar-right">
      <span class="dirty-flag" id="dirtyFlag" hidden>Есть несохранённые изменения</span>
      <a class="btn btn-ghost" href="index.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
      <button type="button" class="btn btn-primary" id="btnSave" disabled>Сохранить</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- Выбор файла -->
<div class="modal" id="mediaModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="mediaModalTitle">Медиатека</h2>
      <button type="button" class="modal-close" id="mediaClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="modal-toolbar">
      <label class="field-inline">
        <span>Папка</span>
        <select id="mediaFolder"></select>
      </label>
      <label class="field-inline">
        <span>Новая папка</span>
        <input type="text" id="mediaNewFolder" placeholder="например, harry-potter">
      </label>
      <label class="btn btn-primary upload-btn">
        Загрузить файлы
        <input type="file" id="mediaUpload" multiple hidden>
      </label>
    </div>
    <p class="modal-note" id="mediaNote"></p>
    <div class="media-grid" id="mediaGrid"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/pricing-config.js?v=75"></script>
<script src="js/pricing-schema.js?v=75"></script>
<script src="js/admin.js?v=5"></script>
</body>
</html>
