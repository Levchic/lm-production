<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Услуги и цены — Лев Майденко</title>
<meta name="description" content="Оркестровые аранжировки, оркестровка, нотный набор, клик и плейбэк: цены-ориентиры, принцип расчёта и калькулятор предварительной стоимости проекта.">
<link rel="canonical" href="https://levchic.github.io/lm-production/services.html">

<!-- Карточка ссылки в мессенджерах и соцсетях. Значения статические:
     боты предпросмотра не выполняют JS, поэтому подставить их из
     content.js во время загрузки нельзя. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Лев Майденко · L.M.Production">
<meta property="og:locale" content="ru_RU">
<meta property="og:url" content="https://levchic.github.io/lm-production/services.html">
<meta property="og:title" content="Услуги и цены — Лев Майденко">
<meta property="og:description" content="Цены-ориентиры, принцип расчёта и калькулятор предварительной стоимости оркестровых работ.">
<meta property="og:image" content="https://levchic.github.io/lm-production/assets/media/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Оркестр на сцене во время концерта: дирижёр, струнная группа и свечи вдоль рампы">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/unbounded-cyrillic-normal-400-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/onest-cyrillic-normal-300-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=80">
<link rel="stylesheet" href="css/styles.css?v=80">
<link rel="stylesheet" href="css/texture.css?v=80">
<link rel="stylesheet" href="css/animations.css?v=80">
</head>
<body data-title-key="services.heading">

<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="brand" data-bind="nav.brand">Л.М.</a>
    <nav class="main-nav" id="mainNav" aria-label="Основная навигация">
      <ul id="navLinks"></ul>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span class="lang-current">RU</span><span class="lang-sep">/</span><span class="lang-other">EN</span>
      </button>
      <a href="index.html#contact" class="btn btn-primary btn-small" data-bind="nav.cta">Обсудить проект</a>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="page-header">
    <div class="ink-stain" aria-hidden="true"></div>
    <div class="wrap reveal" data-reveal>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="heading"></h1>
      <p class="desc" id="sub"></p>
    </div>
  </section>

  <div class="tear-divider">
    <svg viewBox="0 0 1200 30" preserveAspectRatio="none">
      <polygon fill="currentColor" points="0,30 0,8 45,15 85,3 140,13 185,1 250,11 300,4 365,16 410,2 470,10 525,5 590,14 640,1 705,12 760,3 820,15 880,6 940,10 1000,2 1060,13 1120,4 1170,9 1200,7 1200,30"/>
    </svg>
  </div>

  <!-- Витрина услуг: ориентиры по каждой работе. Точные цифры считает
       калькулятор ниже, полный прайс высылается по запросу. -->
  <section class="section section-deep">
    <div class="wrap">
      <div class="services-groups" id="servicesGroups"></div>
    </div>
  </section>

  <!-- Принцип расчёта. Стоит перед калькулятором: сначала объясняем, из
       чего складывается цена, потом даём считать. -->
  <section class="section">
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="pricingEyebrow"></span>
        <h2 id="pricingHeading"></h2>
        <p class="section-sub" id="pricingSub"></p>
      </div>
      <div class="principles" id="pricingPrinciples"></div>
    </div>
  </section>

  <!-- Калькулятор. Разметку собирает js/pricing-ui.js, узел #calcHost
       остаётся на месте между перерисовками — на нём висят обработчики. -->
  <section class="section section-deep" id="calculator">
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="calcEyebrow"></span>
        <h2 id="calcHeading"></h2>
        <p class="section-sub" id="calcSub"></p>
      </div>
      <!-- Калькулятор раскрывается по кнопке. Семь шагов сразу на экране
           встречают посетителя стеной вопросов, на которые он ещё не знает
           ответа; ориентиры по ценам он уже видел в витрине выше. Узел
           #calcHost остаётся в разметке всегда — pricing-ui.js держит на
           нём состояние формы, — но наполняется при первом раскрытии. -->
      <div class="calc-toggle-wrap reveal" data-reveal>
        <button class="btn btn-ghost calc-toggle" id="calcToggle" type="button" aria-expanded="false" aria-controls="calcHost"></button>
        <p class="calc-toggle-note" id="calcToggleNote"></p>
      </div>
      <div class="calc" id="calcHost" hidden></div>
    </div>
  </section>

  <!-- Работы, которые не считаются формулой. -->
  <section class="section">
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="extraEyebrow"></span>
        <h2 id="extraHeading"></h2>
        <p class="section-sub" id="extraSub"></p>
      </div>
      <ul class="price-list" id="extraList"></ul>
    </div>
  </section>

  <section class="section section-deep">
    <div class="wrap">
      <div class="section-head reveal" data-reveal>
        <span class="eyebrow" id="termsEyebrow"></span>
        <h2 id="termsHeading"></h2>
      </div>
      <div class="terms-grid" id="termsList"></div>

      <div class="terms-cta reveal" data-reveal>
        <div>
          <h3 id="termsCtaHeading"></h3>
          <p id="termsCtaText"></p>
        </div>
        <a href="index.html#contact" class="btn btn-primary" id="termsCtaLink"></a>
      </div>

      <p class="services-note" id="note"></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div><span class="footer-brand" data-bind="nav.brand">Л.М.</span><span class="footer-tagline" data-bind="footer.tagline"></span></div>
    <p class="footer-rights" id="footerRights"></p>
    <a href="faq.html" class="footer-link" data-bind="footer.faq">Частые вопросы</a>
    <a href="privacy.html" class="footer-privacy" data-bind="footer.privacy">Политика конфиденциальности</a>
  </div>
</footer>

<script src="js/content.js?v=80"></script>
<script src="js/common.js?v=80"></script>
<script src="js/pricing-config.js?v=80"></script>
<script src="js/pricing-overrides.js?v=80"></script>
<script src="js/pricing-calc.js?v=80"></script>
<script src="js/pricing-ui.js?v=80"></script>
<script src="js/page-services.js?v=80"></script>
<script src="js/mobile-carousel.js?v=80"></script>
</body>
</html>
